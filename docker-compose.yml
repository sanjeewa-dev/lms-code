# Local / team Docker stack (Mac + Windows Docker Desktop)
#
# Usage:
#   cp .env.docker.example .env
#   docker compose up --build -d
#   open http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=300 -c shared_buffers=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindspark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindspark}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mindspark} -d ${POSTGRES_DB:-mindspark}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lms

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindspark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindspark}?schema=public&connection_limit=25
      PORT: '4000'
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-true}
      NMS_BASE_URL: ${NMS_BASE_URL:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-8}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-25}
      MAX_IN_FLIGHT_PER_WORKER: ${MAX_IN_FLIGHT_PER_WORKER:-400}
      MAX_CONNECTIONS_PER_WORKER: ${MAX_CONNECTIONS_PER_WORKER:-1000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-60000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms
    expose:
      - '4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8080}:80'
    depends_on:
      - backend
    networks:
      - lms

volumes:
  pgdata:
  uploads:

networks:
  lms:
    driver: bridge
